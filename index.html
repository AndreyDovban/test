<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="/styles/style.css" />
		<title>Test App</title>
		<style>
			svg.green stop:nth-child(1) {
				stop-color: #60c50b;
			}
			svg.green stop:nth-child(2) {
				stop-color: #139a26;
			}

			svg.red stop:nth-child(1) {
				stop-color: #c84f31;
			}
			svg.red stop:nth-child(2) {
				stop-color: #da3448;
			}
		</style>
	</head>
	<body>
		<div id="app">
			<!-- <pre class="out"></pre>
			<pre class="out2"></pre>
			<pre class="out3"></pre> -->
			<svg class="green" width="100" height="50" version="1.1" xmlns="http://www.w3.org/2000/svg">
				<linearGradient id="gradient">
					<stop offset="0%" />
					<stop offset="100%" />
				</linearGradient>
				<rect width="100" height="50" fill="url(#gradient)" />
			</svg>
			<svg class="red" width="100" height="50" version="1.1" xmlns="http://www.w3.org/2000/svg">
				<linearGradient>
					<stop offset="0%" />
					<stop offset="100%" />
				</linearGradient>
				<rect width="100" height="50" />
			</svg>
		</div>
	</body>
	<!-- <script type="module" src="/script.js"></script> -->
	<!-- <script type="module" src="/json2pdf.js"></script> -->
	<!-- <script type="module" src="/test.js"></script> -->
	<!-- <script type="module" src="/tree.js"></script> -->
	<script>
		'use strict';
		let rand = (min, max) => {
			return String(Math.floor(Math.random() * (max - min + 1)) + min);
		};

		let elems = document.querySelector('#app').querySelectorAll('svg');
		for (let el of elems) {
			let id = rand(10000, 99999);
			for (let k of el.children) {
				console.log(k.tagName);
				if (k.tagName == 'rect') {
					k.setAttribute('fill', 'url(#' + id + ')');
				}
				if (k.tagName == 'linearGradient') {
					k.setAttribute('id', id);
				}
			}
		}
	</script>
</html>
